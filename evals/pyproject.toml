[project]
name = "marketplace-evals"
version = "0.1.0"
description = "Eval harness for christopherdavenport-marketplace skills."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
vertex = ["anthropic[vertex]>=0.40"]
bedrock = ["anthropic[bedrock]>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
