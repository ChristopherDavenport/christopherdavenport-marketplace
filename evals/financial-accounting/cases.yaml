# Financial accounting eval cases. Knowledge plugin: rubric checks
# include ASC-citation-format regexes, Call Report line references, and
# the post-CECL terminology (ALLL → ACL).

# ---------- Positive cases ----------

- id: cecl-allowance
  prompt: |
    Our community bank is recording the quarterly provision for the
    allowance for credit losses on the loan portfolio. Walk me
    through the journal entry and which ASC topic governs it.
  judge_focus: |
    The better answer cites ASC 326 (specifically 326-20 for amortized
    cost loans), shows the journal entry with the right account types
    (provision expense Dr / allowance for credit losses Cr), and uses
    current "ACL" or "allowance for credit losses" terminology rather
    than the superseded "ALLL".
  rubric:
    - name: cites ASC 326
      kind: any_of
      patterns:
        - 'ASC 326'
        - 'Topic 326'
        - 'ASC §\s*326'
      why: 'core CECL standard'
    - name: cites specific subtopic 326-20
      kind: any_of
      patterns:
        - 'ASC 326-20'
        - '326-20-'
      why: 'amortized-cost subtopic, not 326-30 (AFS)'
    - name: shows journal entry direction
      kind: any_of
      patterns:
        - 'debit.{0,30}provision'
        - 'Dr.{0,30}provision'
        - 'credit.{0,30}allowance'
        - 'Cr.{0,30}allowance'
      why: 'standard double-entry direction'
    - name: avoids superseded ALLL terminology as primary
      kind: must_not_contain
      pattern: 'recommend[a-z]*\s+(using|the)?\s*ALLL'
      why: 'ALLL was replaced by ACL under CECL'
    - name: mentions post-CECL contra-asset framing
      kind: any_of
      patterns:
        - 'contra[-\s]?asset'
        - 'allowance for credit losses'
        - '\bACL\b'
      why: 'modern post-CECL terminology'

- id: deposits-on-bank-balance-sheet
  prompt: |
    A customer makes a $5,000 cash deposit at our bank's teller
    window. Show me the bank's journal entry and explain why the
    deposit shows as a credit on our books.
  judge_focus: |
    The better answer correctly identifies that customer deposits
    are LIABILITIES on the bank's balance sheet (not assets), and
    walks through the entry: Dr Cash $5,000 / Cr Deposits Payable
    $5,000. Bonus for citing the relevant Call Report line.
  rubric:
    - name: identifies deposits as liability on bank books
      kind: any_of
      patterns:
        - 'liability'
        - 'liabilities'
      why: 'core conceptual point — common confusion'
    - name: shows correct entry direction (Cash Dr, Deposit Cr)
      kind: any_of
      patterns:
        - 'debit.{0,30}cash'
        - 'Dr.{0,5}cash'
        - 'credit.{0,30}deposit'
        - 'Cr.{0,5}deposit'
      why: 'concrete entry'
    - name: mentions Call Report or Schedule RC-E
      kind: any_of
      patterns:
        - 'Call Report'
        - 'RC-E'
        - 'Schedule RC'
      why: 'industry-specific reporting alignment'
    - name: explains liability framing (owes the customer)
      kind: any_of
      patterns:
        - 'owes?'
        - 'obligation'
        - 'borrow'
        - 'payable'
      why: 'reframes for a non-banking reader'

- id: loan-fees-deferral
  prompt: |
    We charged a borrower a $2,000 origination fee on a 5-year term
    loan. How do we recognize this fee under GAAP, and which ASC
    section governs it?
  judge_focus: |
    The better answer cites ASC 310-20 (Receivables — Nonrefundable
    Fees), explains effective-interest amortization over the loan
    life, and notes that the fee defers as a contra to the loan
    balance (not booked immediately to income).
  rubric:
    - name: cites ASC 310-20
      kind: any_of
      patterns:
        - 'ASC 310-20'
        - '310-20-'
      why: 'specific subtopic for nonrefundable fees'
    - name: mentions effective-interest method
      kind: any_of
      patterns:
        - 'effective[-\s]?interest'
        - 'effective yield'
      why: 'the recognition method'
    - name: mentions deferral / contra-asset framing
      kind: any_of
      patterns:
        - 'defer'
        - 'amortiz'
        - 'contra'
      why: 'fee is not booked to income immediately'
    - name: rejects immediate fee income recognition
      kind: any_of
      patterns:
        - 'not.{0,15}immediately'
        - 'not.{0,15}upfront'
        - 'over the (life|term)'
        - 'rather than'
      why: 'common mistake to call out'

- id: control-account-reconciliation
  prompt: |
    What's the difference between a general ledger control account
    and a sub-ledger? Why does it matter that they reconcile, and
    how often should banks reconcile them?
  judge_focus: |
    The better answer crisply distinguishes the two (control account
    holds the summary balance; sub-ledger holds detailed records),
    explains the reconciliation discipline (sub total must equal
    control balance), and gives realistic FI cadence (daily for
    high-volume, monthly for low-volume).
  rubric:
    - name: defines control account
      kind: any_of
      patterns:
        - 'control account'
        - 'summary.{0,15}(balance|total)'
        - 'aggregate'
      why: 'core concept'
    - name: defines sub-ledger
      kind: any_of
      patterns:
        - 'sub[-\s]?ledger'
        - 'subsidiary ledger'
        - 'detail[a-z]* record'
      why: 'core concept'
    - name: explains reconciliation discipline
      kind: any_of
      patterns:
        - 'reconcil'
        - 'tie out'
        - 'tie[-\s]?out'
        - 'must equal'
        - 'matches?'
      why: 'the core FI discipline'
    - name: mentions cadence (daily / monthly)
      kind: any_of
      patterns:
        - 'daily'
        - 'monthly'
        - 'period.{0,15}close'
      why: 'realistic FI operating practice'

- id: afs-securities-credit-loss
  prompt: |
    Our bank holds $2M par of 5-year corporate bonds classified as
    Available-for-Sale. Fair value has dropped 8% because market
    rates rose. The issuer's credit is unchanged. Under current
    GAAP, how do we recognize the decline, and what's the governing
    ASC?
  judge_focus: |
    The better answer cites ASC 320 for AFS classification and ASC
    326-30 (the post-CECL standard that replaced OTTI for AFS). It
    explains the unrealized non-credit decline goes through OCI/AOCI
    (not P&L), and that any credit-related allowance is capped at
    the "lesser of expected credit loss or the amount fair value is
    below amortized cost." Because credit is unchanged here, no
    allowance is required — the entire FV decline sits in AOCI.
  rubric:
    - name: cites ASC 326-30 for AFS credit losses
      kind: any_of
      patterns:
        - 'ASC 326-30'
        - '326-30-'
        - 'Subtopic 326-30'
      why: 'the specific post-CECL AFS subtopic, distinct from 326-20'
    - name: cites ASC 320 for AFS classification
      kind: any_of
      patterns:
        - 'ASC 320'
        - 'Topic 320'
        - '320-10'
      why: 'AFS classification standard'
    - name: routes non-credit unrealized loss through OCI / AOCI
      kind: any_of
      patterns:
        - '\bOCI\b'
        - 'AOCI'
        - 'other comprehensive income'
        - 'accumulated.{0,15}comprehensive'
      why: 'AFS unrealized G/L is OCI, not P&L'
    - name: notes the lesser-of cap on the allowance
      kind: any_of
      patterns:
        - 'lesser of'
        - 'capped'
        - 'limit[a-z]*\s+to'
        - 'cannot exceed'
        - 'below amortized cost'
      why: 'the 326-30 cap is the AFS-specific mechanic'
    - name: avoids the superseded OTTI framing as primary
      kind: must_not_contain
      pattern: 'recommend[a-z]*\s+(using|the)?\s*OTTI'
      why: 'OTTI was replaced by 326-30 for AFS; legacy term should not be the answer'

- id: nonaccrual-interest-reversal
  prompt: |
    A $500k commercial loan goes 95 days past due. Last month we
    recorded $4k of accrued interest income on it. Walk me through
    the journal entries to put the loan on nonaccrual and reverse
    the previously accrued interest.
  judge_focus: |
    The better answer cites the bright-line 90-day past-due rule
    (FFIEC Call Report instructions) for placing on nonaccrual,
    shows the reversal entry — Dr Interest Income / Cr Accrued
    Interest Receivable — and is explicit that this reversal hits
    the income statement and does NOT touch the allowance. Charge-
    off is a separate event that does involve the allowance.
  rubric:
    - name: cites the 90-day past-due bright line
      kind: any_of
      patterns:
        - '90[-\s]?day'
        - 'ninety[-\s]?day'
        - 'past due'
        - 'FFIEC'
        - 'Call Report'
      why: 'the regulatory trigger for nonaccrual placement'
    - name: shows reversal direction (Dr Interest Income, Cr Accrued Interest Receivable)
      kind: any_of
      patterns:
        - 'debit.{0,30}interest income'
        - 'Dr.{0,30}interest income'
        - 'credit.{0,30}accrued interest'
        - 'Cr.{0,30}accrued interest'
      why: 'concrete reversal entry'
    - name: explicitly distinguishes from charge-off / no allowance impact
      kind: any_of
      patterns:
        - 'not.{0,15}charge[-\s]?off'
        - 'separate.{0,15}from.{0,15}charge[-\s]?off'
        - 'no.{0,15}allowance'
        - 'doesn.t.{0,15}touch.{0,15}allowance'
        - 'allowance.{0,15}not affected'
      why: 'common confusion: nonaccrual reversal vs charge-off'
    - name: mentions cash-basis going forward
      kind: any_of
      patterns:
        - 'cash[-\s]?basis'
        - 'when received'
        - 'when collected'
        - 'no longer accru'
        - 'stop.{0,15}accru'
      why: 'completes the nonaccrual mechanics'

- id: loan-held-for-sale-lcm
  prompt: |
    We originated a $750k residential mortgage and immediately
    decided to hold it for sale (we plan to sell to an aggregator
    in 30 days). How do we measure this loan on our balance sheet
    under GAAP, and which ASC applies?
  judge_focus: |
    The better answer identifies HFS classification, cites ASC 948
    (Mortgage Banking) — or ASC 310-10 for non-mortgage HFS — and
    states the measurement basis is lower of cost or market (LCM)
    or lower of cost or fair value (LCFV), NOT amortized cost.
    Contrasts this with held-for-investment loans (amortized cost
    under ASC 310 with an ASC 326-20 allowance).
  rubric:
    - name: cites ASC 948 (or ASC 310-10 for HFS)
      kind: any_of
      patterns:
        - 'ASC 948'
        - 'Topic 948'
        - '948-310'
        - 'ASC 310-10'
      why: 'the governing standard for mortgage HFS measurement'
    - name: states LCM / lower of cost or market measurement
      kind: any_of
      patterns:
        - 'lower of cost or market'
        - '\bLCM\b'
        - 'lower of cost or fair value'
        - 'LCFV'
      why: 'the specific measurement basis that distinguishes HFS'
    - name: contrasts with amortized cost / held-for-investment
      kind: any_of
      patterns:
        - 'amortized cost'
        - 'held[-\s]?for[-\s]?investment'
        - 'HFI'
        - 'not.{0,15}amortized'
        - 'unlike.{0,30}(310|HFI|investment)'
      why: 'must explain *why* HFS is different from regular loan accounting'
    - name: mentions valuation allowance / writedown to market
      kind: any_of
      patterns:
        - 'valuation allowance'
        - 'writedown'
        - 'write[-\s]?down'
        - 'mark.{0,15}(down|to market)'
      why: 'mechanism for booking the LCM adjustment'

# ---------- Adversarial case ----------

- id: simplest-loan-loss
  prompt: |
    Just give me the quick journal entry to record a loan loss when
    a borrower defaults. The loan was $50,000.
  expectation: skill_wins_strict
  judge_focus: |
    The trap: simply Dr "Loan loss expense" Cr "Loans" $50,000.
    Under CECL (ASC 326), losses don't hit P&L directly — they
    charge off against the existing allowance: Dr ACL Cr Loans
    $50,000, with no income statement impact unless the ACL is
    insufficient. The better answer flags this distinction.
  rubric:
    - name: shows charge-off against allowance
      kind: any_of
      patterns:
        - 'allowance'
        - 'ACL'
      why: 'right account is debited'
    - name: explains no direct P&L hit
      kind: any_of
      patterns:
        - 'no.{0,15}(P&L|income statement)'
        - 'doesn.t.{0,15}(hit|affect).{0,15}(P&L|income)'
        - 'already (provided|reserved)'
        - 'against the allowance'
        - 'covered by'
      why: 'critical conceptual distinction post-CECL'
    - name: cites ASC 326 framework
      kind: any_of
      patterns:
        - 'ASC 326'
        - 'CECL'
      why: 'must mention the standard'
    - name: avoids debiting expense directly
      kind: must_not_contain
      pattern: 'debit\s+(loan\s+)?loss\s+expense.{0,40}credit\s+loans'
      why: 'the trap entry'

