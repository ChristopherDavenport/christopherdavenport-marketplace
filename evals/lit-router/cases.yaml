# lit-router skill eval cases. This is a niche library so the skill should
# show the strongest differentiation. Anchored to the SKILL.md known
# pitfalls list (goto-vs-pushState, trailing slash, etc.).

# ---------- Positive cases ----------

- id: goto-doesnt-update-url
  prompt: |
    I'm using @lit-labs/router. I call `this._router.goto('/dashboard')`
    inside a click handler, and the new route renders, but the URL
    bar doesn't change and the browser back button is broken. What's
    going on?
  judge_focus: |
    The better answer pinpoints that goto() does NOT update history,
    and tells the user to call history.pushState (or use a regular
    <a href> link, which the router intercepts).
  rubric:
    - name: explains goto does not push history
      kind: any_of
      patterns:
        - 'does not.{0,15}(push|update).{0,15}(state|history)'
        - 'doesn.t.{0,15}(push|update).{0,15}(state|history)'
        - 'no.{0,15}(pushState|history)'
        - 'history.{0,5}(pushState|state)'
      why: 'the specific gotcha'
    - name: recommends history.pushState
      kind: any_of
      patterns:
        - 'history\.pushState'
        - 'pushState'
        - 'replaceState'
      why: 'the manual workaround'
    - name: mentions <a href> link interception
      kind: any_of
      patterns:
        - '<a href'
        - 'anchor.{0,15}link'
        - 'click.{0,15}intercept'
        - 'link.{0,15}intercept'
        - 'plain.{0,5}link'
      why: 'the cleaner alternative — the router intercepts these'

- id: trailing-slash-routes
  prompt: |
    I have a `@lit-labs/router` route with path `/users/*` for a
    nested users section. When I navigate to `/users` (no trailing
    slash), the route doesn't match. Why, and what do I do?
  judge_focus: |
    The better answer explains URLPattern semantics — `/users/*`
    requires the slash and one of: link with trailing slash, or
    register both `/users` and `/users/*`.
  rubric:
    - name: identifies URLPattern matching semantics
      kind: any_of
      patterns:
        - 'URLPattern'
        - 'pattern.{0,15}(match|require)'
        - 'trailing.{0,5}slash'
      why: 'root cause'
    - name: recommends adding trailing slash to links
      kind: any_of
      patterns:
        - 'trailing slash'
        - 'with the slash'
        - '/users/'
      why: 'the simplest fix'
    - name: mentions registering both paths as alternative
      kind: any_of
      patterns:
        - 'both.{0,15}path'
        - 'two.{0,15}routes'
        - 'register.{0,15}both'
        - '/users.{0,5}and.{0,5}/users/\*'
      why: 'second valid fix'

- id: nested-routes-vs-router
  prompt: |
    My @lit-labs/router app has nested route sections — one for
    `/users/...` and one for `/products/...`. Should each section
    create its own `new Router(...)`? What's the right pattern?
  judge_focus: |
    The better answer says NO — only one Router per page (it installs
    global click + popstate listeners; multiples conflict). Use Routes
    (the other controller) for nested sections.
  rubric:
    - name: identifies one Router per page
      kind: any_of
      patterns:
        - 'one Router'
        - 'single Router'
        - 'only one'
      why: 'the rule'
    - name: recommends Routes for nesting
      kind: any_of
      patterns:
        - '\bRoutes\b'
        - 'Routes controller'
        - 'nested Routes'
      why: 'the right primitive for nested sections'
    - name: mentions global click / popstate listener as the reason
      kind: any_of
      patterns:
        - 'global.{0,15}(click|listener)'
        - 'popstate'
        - 'install[a-z]*.{0,15}listener'
      why: 'why multiple Routers conflict'

- id: link-helper
  prompt: |
    Inside a nested @lit-labs/router section mounted at `/users/`,
    I want to render a link to a child route at `detail`. If I write
    `<a href="detail">`, it won't work. What's the right way?
  judge_focus: |
    The better answer reaches for the link() helper on the Routes
    controller, which resolves relative to the parent route prefix.
  rubric:
    - name: recommends link() helper
      kind: any_of
      patterns:
        - '\.link\('
        - 'link\(.{0,30}\)'
        - 'link helper'
        - 'routes\.link'
      why: 'the specific API'
    - name: explains relative resolution
      kind: any_of
      patterns:
        - 'relative'
        - 'parent.{0,15}prefix'
        - 'parent route'
        - 'mount.{0,15}point'
      why: 'why bare href fails'

- id: click-interception-rules
  prompt: |
    I have a @lit-labs/router app where most `<a href>` links work as
    SPA navigation. But two of them aren't intercepted: one is
    `<a href="/users/123" target="_blank">` and another is
    `<a href="/external" rel="external">`. Why aren't they being
    intercepted by the router?
  judge_focus: |
    The better answer enumerates the specific conditions Router uses
    to decide *not* to intercept a click: `target` set, `rel="external"`,
    `download` attribute, modifier keys held (cmd/ctrl/shift/alt),
    or non-same-origin href. The router intentionally lets the browser
    handle these because they're conventional opt-outs.
  rubric:
    - name: lists target attribute as an opt-out
      kind: must_contain
      pattern: '\btarget\b'
      why: 'target=_blank is one of the standard opt-outs'
    - name: lists rel=external as an opt-out
      kind: any_of
      patterns:
        - 'rel="external"'
        - 'rel=external'
        - 'rel.{0,5}external'
      why: 'the second opt-out the user is hitting'
    - name: mentions modifier keys as a third opt-out
      kind: any_of
      patterns:
        - 'modifier'
        - 'cmd|ctrl|shift|alt'
        - 'meta key'
      why: 'evidence the answer knows the full opt-out list'
    - name: mentions same-origin restriction
      kind: any_of
      patterns:
        - 'same[-\s]?origin'
        - 'cross[-\s]?origin'
        - 'external.{0,15}URL'
      why: 'router only intercepts same-origin links'

- id: active-link-styling
  prompt: |
    I want to highlight the current nav link in my @lit-labs/router app
    based on the active route. Is there a built-in `activeLink`
    directive or a route-changed event I can listen to?
  judge_focus: |
    The better answer states honestly that lit-router has NO built-in
    active-link helper or route-change event — you read
    `window.location.pathname` (or compare against the router's params
    / current route) at render time and apply your own active class.
    It does not invent a directive that doesn't exist.
  rubric:
    - name: states there is no built-in helper
      kind: any_of
      patterns:
        - 'no.{0,15}(built[-\s]?in|helper|directive)'
        - 'doesn.t.{0,15}(provide|have|ship)'
        - 'not.{0,15}(provided|built[-\s]?in)'
      why: 'must be honest about the missing API'
    - name: recommends reading location.pathname or router state
      kind: any_of
      patterns:
        - 'location\.pathname'
        - 'window\.location'
        - 'router\.params'
        - 'current.{0,15}(route|path)'
      why: 'the actual mechanism for "what route is active"'
    - name: applies class at render time
      kind: any_of
      patterns:
        - 'classMap'
        - 'class=\$\{'
        - 'render.{0,30}class'
        - 'compare.{0,30}render'
      why: 'how the active class is applied per render'
    - name: avoids inventing an activeLink directive
      kind: must_not_contain
      pattern: 'activeLink|active-link.{0,30}directive|routerActive'
      why: 'these APIs do not exist on lit-labs/router'

- id: enter-vs-task-data-loading
  prompt: |
    My @lit-labs/router route renders a UserDetail component that needs
    to fetch user data based on a route param. Should I do the fetch in
    the route's `enter` callback or with `@lit/task` inside the
    component? What's the tradeoff?
  judge_focus: |
    The better answer explains the two options as different shapes:
    `enter` is awaited by the router and BLOCKS the route update until
    it resolves (no UI until data is ready, no per-component loading
    state); `@lit/task` runs inside the component, gives you status
    states (pending/complete/error) for loading UI, and supports
    cancellation via AbortSignal so a second navigation cancels the
    first fetch. Picks based on whether the user wants a blocking
    preload or a component-local loading experience.
  rubric:
    - name: explains enter blocks the route update
      kind: any_of
      patterns:
        - 'block'
        - 'await.{0,30}enter'
        - 'before.{0,15}render'
        - 'awaits?\s+the\s+promise'
      why: 'the key behavioral difference of enter'
    - name: mentions Task gives status / loading state
      kind: any_of
      patterns:
        - 'status'
        - 'pending'
        - 'loading state'
        - 'progress'
      why: 'why you would prefer Task for component-local UX'
    - name: mentions cancellation / race-safety with Task
      kind: any_of
      patterns:
        - 'cancel'
        - 'AbortSignal'
        - 'race'
        - 'stale'
        - 'second.{0,15}(navigation|goto|fetch)'
      why: 'Task handles cancellation; enter has no built-in cancel token'
    - name: names @lit/task explicitly
      kind: any_of
      patterns:
        - '@lit/task'
        - 'lit/task'
        - '\bTask\b'
      why: 'concrete API the user is comparing against'

# ---------- Adversarial case ----------

- id: simplest-hash-routing
  prompt: |
    I want hash routing (URLs like /#/users/123 instead of
    /users/123) using @lit-labs/router. What's the simplest way to
    set this up?
  expectation: skill_wins_strict
  judge_focus: |
    The trap: invent a hash-routing setup. @lit-labs/router does NOT
    support hash routing — the router inspects pathname, not hash.
    The correct answer is to say so and offer alternatives (use a
    different router, or pre-process URLs to map hash -> pathname).
  rubric:
    - name: states hash routing is not supported
      kind: any_of
      patterns:
        - 'not support'
        - 'doesn.t support'
        - 'no hash'
        - 'pathname.{0,15}only'
        - 'inspect.{0,15}pathname'
      why: 'must call out the absence honestly'
    - name: avoids inventing a hash-routing API
      kind: must_not_contain
      pattern: 'hashRouting|hash:\s*true|HashRouter'
      why: 'these APIs do not exist on lit-labs/router'

# ---------- Off-topic guard ----------

- id: offtopic-git-rebase
  prompt: |
    What's the difference between `git merge` and `git rebase`?
    Just a short, plain explanation.
  expectation: tie
  judge_focus: |
    This question has nothing to do with lit-router. Both answers
    should be essentially equivalent. Pick "tie" unless one is
    materially wrong.
  rubric: []
