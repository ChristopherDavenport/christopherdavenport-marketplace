# Spanner skill eval cases. Anchored to distinct idiom clusters from
# backend/spanner/skills/spanner/SKILL.md and references/.

# ---------- Positive cases ----------

- id: write-throughput-flat
  prompt: |
    My Cloud Spanner write throughput is flat at around 2k QPS no matter
    how many nodes I add. The table has a primary key like
    `Id INT64 GENERATED BY DEFAULT AS IDENTITY`. What's going on and how
    do I fix it?
  judge_focus: |
    The better answer identifies that monotonic IDs hot-spot one split,
    names the specific Spanner remediations (BIT_REVERSED_POSITIVE,
    NEW_UUID, hash-shard prefix), and notes that PK changes are
    irreversible so a migration is needed.
  rubric:
    - name: identifies hotspot from monotonic key
      kind: any_of
      patterns:
        - 'hot[-\s]?spot'
        - 'one split'
        - 'single split'
        - 'monotonic'
      why: 'the actual root cause'
    - name: recommends BIT_REVERSED_POSITIVE
      kind: must_contain
      pattern: 'BIT_REVERSED_POSITIVE'
      why: 'specific Spanner mechanism for scattering INT64 IDs'
    - name: mentions UUID alternative
      kind: any_of
      patterns:
        - 'NEW_UUID'
        - 'gen_random_uuid'
        - 'UUIDv?4'
      why: 'the other canonical surrogate key strategy'
    - name: notes PK change is irreversible / requires migration
      kind: any_of
      patterns:
        - 'irreversibl'
        - 'cannot.{0,30}(change|alter)'
        - 'migrat'
        - 'recreate'
      why: 'critical operational warning Spanner-specific to PK changes'

- id: rwt-aborted-spam
  prompt: |
    My Go service uses Spanner's ReadWriteTransaction and I keep seeing
    Aborted errors in the logs. Latency is also spiking. My transaction
    closure does some database reads, makes an HTTP call to a billing
    service, logs the result, then commits. What's wrong?
  judge_focus: |
    The better answer pinpoints the side effects (HTTP call, log line)
    inside a closure that the client auto-retries on Aborted, and tells
    the user to keep the closure pure.
  rubric:
    - name: identifies closure auto-retry semantics
      kind: any_of
      patterns:
        - 'auto[-\s]?retr'
        - 'retried'
        - 'retries'
        - 'multiple times'
        - 'run.{0,15}again'
      why: 'the missing mental model behind the bug'
    - name: warns about side effects in closure
      kind: any_of
      patterns:
        - 'side effect'
        - 'pure'
        - 'idempotent'
        - 'double[-\s]?fire'
        - 'no.{0,15}(API|HTTP|external).{0,15}call'
      why: 'specific guidance to remove non-pure work'
    - name: mentions Aborted is normal / expected
      kind: any_of
      patterns:
        - 'expected'
        - 'normal'
        - 'by design'
        - 'transient'
        - 'contention'
      why: 'reframe Aborted as a contract, not an error'

- id: like-prefix-not-using-index
  prompt: |
    My Spanner query `SELECT * FROM Users WHERE name LIKE @prefix` is
    slow even though I have an index on name. The prefix is bound as a
    parameter like 'jane%'. Why won't the index get used?
  judge_focus: |
    The better answer names STARTS_WITH as the Spanner-specific
    replacement and explains why parameterized LIKE blocks the optimizer.
  rubric:
    - name: recommends STARTS_WITH
      kind: must_contain
      pattern: 'STARTS_WITH'
      why: 'the specific function Spanner provides for prefix matching'
    - name: explains why LIKE blocks index use
      kind: any_of
      patterns:
        - 'plan cach'
        - 'cannot prove'
        - 'unknown.{0,20}prefix'
        - 'parameter'
        - 'opaque'
      why: 'the root cause'
    - name: mentions FORCE_INDEX or EXPLAIN
      kind: any_of
      patterns:
        - 'FORCE_INDEX'
        - 'EXPLAIN'
        - 'query plan'
      why: 'how to verify the fix'

- id: interleave-decision
  prompt: |
    I'm designing a new schema with an Orders table and an OrderItems
    table. OrderItems will almost always be read together with their
    parent Order. Should I interleave them, use a foreign key, or
    something else? What are the tradeoffs?
  judge_focus: |
    The better answer recommends interleaving for this access pattern,
    cites the locality benefit, and crucially warns that interleaving is
    irreversible — you cannot un-interleave a table once it has data.
  rubric:
    - name: recommends interleaving here
      kind: must_contain
      pattern: 'INTERLEAVE'
      why: 'right primitive for this co-located access pattern'
    - name: mentions ON DELETE CASCADE
      kind: must_contain
      pattern: 'ON\s+DELETE\s+CASCADE'
      why: 'standard interleave pattern; required for parent delete'
    - name: warns about irreversibility
      kind: any_of
      patterns:
        - 'irreversibl'
        - 'cannot.{0,20}(undo|reverse|un-interleave)'
        - 'permanent'
        - 'decide.{0,15}before'
      why: 'critical operational warning'
    - name: mentions interleave depth or limits
      kind: any_of
      patterns:
        - '7\s+level'
        - 'depth'
        - 'one parent'
      why: 'evidence the answer engages with Spanner-specific limits'

- id: stale-reads-for-latency
  prompt: |
    My Spanner read query is slow in a multi-region instance — looks like
    it's hitting the leader region every time. I'm just powering a "recent
    activity" widget; data being a few seconds out of date is fine. How do
    I make this faster?
  judge_focus: |
    The better answer reaches for a read-only transaction with bounded
    staleness (MaxStaleness or ExactStaleness) so the read can be served
    from the closest replica instead of the leader. It explains the
    consistency tradeoff and uses the Go client's WithTimestampBound /
    Single().WithTimestampBound API.
  rubric:
    - name: recommends a stale / bounded-staleness read
      kind: any_of
      patterns:
        - 'stale\s+read'
        - 'bounded\s+staleness'
        - 'MaxStaleness'
        - 'ExactStaleness'
      why: 'the actual primitive that lets replicas serve the read'
    - name: uses a read-only / single-use transaction
      kind: any_of
      patterns:
        - 'ReadOnlyTransaction'
        - 'Single\s*\(\s*\)'
        - 'read[-\s]only\s+transaction'
      why: 'staleness bounds only apply to read-only paths'
    - name: explains it can serve from a closer replica
      kind: any_of
      patterns:
        - 'closest\s+replica'
        - 'nearest\s+replica'
        - 'local\s+replica'
        - 'avoid.{0,15}leader'
        - 'replica\s+(read|serve)'
      why: 'the *why* behind the latency win'
    - name: notes the consistency tradeoff
      kind: any_of
      patterns:
        - 'tradeoff'
        - 'trade-off'
        - 'eventual'
        - 'out of date'
        - 'stale data'
      why: 'must call out that fresh-read guarantees are weakened'

- id: null-filtered-index-mismatch
  prompt: |
    I created a NULL_FILTERED index on `Users(deleted_at)` to keep the
    index small (most rows have deleted_at = NULL). My query
    `SELECT * FROM Users WHERE deleted_at IS NOT NULL` is still doing
    a full scan according to EXPLAIN. What's wrong?
  judge_focus: |
    The better answer explains that NULL_FILTERED indexes only contain
    rows where the indexed column is non-NULL, and that the optimizer
    will only choose this index when the query expression matches —
    typically requiring an explicit `IS NOT NULL` predicate or
    FORCE_INDEX. The user's query *should* be able to use it, so the
    likely fix is FORCE_INDEX or rechecking the index column list.
  rubric:
    - name: explains NULL_FILTERED contains only non-NULL rows
      kind: any_of
      patterns:
        - 'non[-\s]?NULL'
        - 'not.{0,5}NULL'
        - 'excludes?\s+NULL'
        - 'rows.{0,30}NULL'
      why: 'the operative semantic of NULL_FILTERED'
    - name: explains optimizer must prove the predicate filters NULLs
      kind: any_of
      patterns:
        - 'IS NOT NULL'
        - 'optimizer'
        - 'must match'
        - 'predicate'
        - 'matching\s+(WHERE|filter)'
      why: 'why the index is not auto-selected even when it should be'
    - name: recommends FORCE_INDEX as the override
      kind: must_contain
      pattern: 'FORCE_INDEX'
      why: 'standard escape hatch when the planner picks wrong'
    - name: mentions EXPLAIN to verify
      kind: any_of
      patterns:
        - 'EXPLAIN'
        - 'query plan'
      why: 'confirming the index is now used'

# ---------- Adversarial case ----------

- id: simplest-bulk-update
  prompt: |
    I just need to set status='inactive' on every row in my Users table
    where last_login is older than a year. There are about 50 million
    rows. Give me the simplest, fewest-lines way to do this in Spanner.
  expectation: skill_wins_strict
  judge_focus: |
    The naive answer is a single UPDATE statement. Spanner caps a
    ReadWriteTransaction at 80,000 mutations and 100 MiB — so a 50M-row
    UPDATE will fail. The right answer is PartitionedUpdate / partitioned
    DML, with a callout that statements must be idempotent. The skill
    must steer to that, not the naive UPDATE.
  rubric:
    - name: recommends partitioned DML
      kind: any_of
      patterns:
        - 'PartitionedUpdate'
        - 'partitioned\s+DML'
        - 'partitionedDML'
      why: 'the right primitive for bulk updates above the txn limits'
    - name: warns about 80k mutation / 100 MiB limit
      kind: any_of
      patterns:
        - '80[,]?000'
        - '80\s?k'
        - '100\s?Mi?B'
        - 'mutation\s+limit'
        - 'transaction.{0,20}limit'
      why: 'explains why naive UPDATE fails'
    - name: mentions idempotency requirement
      kind: any_of
      patterns:
        - 'idempoten'
        - 're-?run'
        - 'retried'
        - 'partial[a-z]* applied'
      why: 'partitioned DML can re-apply per partition'
    - name: avoids recommending plain UPDATE without warning
      kind: must_not_contain
      pattern: '^\s*UPDATE\s+Users\s+SET\s+status\s*=\s*[''"]inactive[''"][^\n]*\n*\s*$'
      why: 'a single bare UPDATE is the trap'

