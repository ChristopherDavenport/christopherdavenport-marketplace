# TypeScript skill eval cases. Anchored to distinct idiom clusters from
# backend/typescript/skills/typescript/SKILL.md and references/.

# ---------- Positive cases ----------

- id: discriminated-union-exhaustive
  prompt: |
    I have a TypeScript type representing a request lifecycle:
    `type Request = { kind: "pending" } | { kind: "ok", value: string } | { kind: "error", message: string }`.
    Show me how to handle all variants in a function and ensure that
    if I add a new variant later, the compiler will catch all the
    places I forgot to update.
  judge_focus: |
    The better answer uses a switch on the discriminant with a
    `default: const _: never = x` exhaustive check, not casts or
    runtime assertions.
  rubric:
    - name: uses switch on discriminant
      kind: any_of
      patterns:
        - 'switch\s*\(\s*\w+\.kind'
        - 'switch.{0,40}kind'
      why: 'canonical pattern'
    - name: uses never-typed exhaustiveness check
      kind: any_of
      patterns:
        - ':\s*never'
        - 'assertNever'
        - 'exhaustive'
      why: 'the specific compile-time guarantee'
    - name: avoids any
      kind: must_not_contain
      pattern: ':\s*any\b'
      why: 'idiomatic answer never reaches for any here'

- id: satisfies-vs-annotation
  prompt: |
    What's the difference between writing `const config: Config = { ... }`
    and `const config = { ... } satisfies Config` in TypeScript? When
    should I use `satisfies`?
  judge_focus: |
    The better answer explains that `: T` widens the inferred type to T,
    while `satisfies T` validates the shape without widening — preserving
    literal types for downstream inference.
  rubric:
    - name: mentions widening from annotation
      kind: any_of
      patterns:
        - 'widen'
        - 'wider'
        - 'broader'
        - 'lose.{0,15}literal'
      why: 'the actual semantic difference'
    - name: uses satisfies keyword
      kind: must_contain
      pattern: '\bsatisfies\b'
      why: 'the operator under discussion'
    - name: mentions preserving literal / narrow inferred type
      kind: any_of
      patterns:
        - 'preserv'
        - 'narrow'
        - 'literal'
        - 'inferr?ed'
      why: 'the value of satisfies'

- id: unknown-vs-any
  prompt: |
    I'm parsing JSON from an HTTP response in TypeScript. What type
    should the parsed value have, and why?
  judge_focus: |
    The better answer recommends `unknown` (forces narrowing) over `any`
    (silently disables typechecking), and shows a narrowing or validation
    step.
  rubric:
    - name: recommends unknown
      kind: must_contain
      pattern: '\bunknown\b'
      why: 'the right type at I/O boundary'
    - name: explains why not any
      kind: any_of
      patterns:
        - 'any.{0,30}(disable|silent|poison|propagat)'
        - 'unsafe'
        - 'no checks'
      why: 'the trade-off'
    - name: shows narrowing or validation step
      kind: any_of
      patterns:
        - 'typeof'
        - 'instanceof'
        - 'narrow'
        - 'type guard'
        - 'predicate'
        - 'zod'
        - 'schema'
        - 'validator'
      why: 'unknown without narrowing is just slower any'

- id: branded-types
  prompt: |
    In my TypeScript codebase I have UserId and OrderId, both currently
    just `string`. We have a bug where someone passed an OrderId to a
    function expecting a UserId and TypeScript didn't catch it. How do
    I prevent this kind of mistake?
  judge_focus: |
    The better answer reaches for branded (nominal) types using a
    phantom `__brand` property to make the types structurally distinct.
  rubric:
    - name: recommends branded types
      kind: any_of
      patterns:
        - 'brand'
        - 'nominal'
        - '__brand'
        - 'phantom'
      why: 'the canonical TS pattern for nominal-flavored types'
    - name: shows __brand or similar phantom property
      kind: any_of
      patterns:
        - '__brand'
        - '__tag'
        - 'unique symbol'
        - 'readonly\s+_[a-zA-Z]+:'
      why: 'concrete implementation'
    - name: explains structural typing as the cause
      kind: any_of
      patterns:
        - 'structural'
        - 'shape'
        - 'duck typ'
      why: 'why TypeScript does not catch it by default'

- id: abortsignal-cancellation
  prompt: |
    I have an async TypeScript function that fetches data in chunks
    and may take a few minutes. I want callers to be able to cancel
    it mid-flight. What's the modern, idiomatic way to expose this?
  judge_focus: |
    The better answer accepts an AbortSignal parameter, propagates
    it into inner awaitable calls (fetch, child operations), and
    checks for abort at suspension points (signal.throwIfAborted()
    or by listening to 'abort'). It does not invent a custom
    cancellation token type or rely on a boolean flag.
  rubric:
    - name: accepts an AbortSignal parameter
      kind: any_of
      patterns:
        - 'signal\??:\s*AbortSignal'
        - 'AbortSignal'
      why: 'the platform primitive for async cancellation'
    - name: forwards signal into inner async calls
      kind: any_of
      patterns:
        - 'fetch\s*\([^)]*signal'
        - '\{\s*signal\s*\}'
        - 'signal\s*[:,]\s*signal'
      why: 'cancellation only works if it propagates downstream'
    - name: checks for abort at suspension points
      kind: any_of
      patterns:
        - 'throwIfAborted'
        - 'signal\.aborted'
        - 'AbortError'
      why: 'long-running loops must observe the signal between awaits'
    - name: avoids inventing a custom cancellation token
      kind: must_not_contain
      pattern: 'class\s+CancellationToken'
      why: 'AbortSignal is the standard; rolling your own is a smell'

- id: mapped-type-validators
  prompt: |
    I have a TypeScript config object where some fields are strings
    and some are numbers. I want a separate type that says "for every
    field in Config, there must be a validator function that takes
    that field's exact type and returns boolean." How do I express
    this at the type level?
  judge_focus: |
    The better answer reaches for a mapped type keyed by `keyof T`
    with the value type derived from `T[K]` so each validator is
    typed against its own field's exact type. It does not collapse
    everything to `(value: unknown) => boolean` or `any`.
  rubric:
    - name: uses a mapped type over keyof
      kind: any_of
      patterns:
        - '\[\s*K\s+in\s+keyof'
        - '\[\s*K\s+extends\s+keyof'
        - '\{\s*\[K\s+in\s+keyof'
      why: 'the canonical pattern for "one entry per field of T"'
    - name: indexes into T with T[K]
      kind: must_contain
      pattern: 'T\[K\]'
      why: 'each validator must receive its own field type, not a union'
    - name: shows a per-field validator function shape
      kind: any_of
      patterns:
        - '\(\s*value\s*:\s*T\[K\]\s*\)'
        - '\(\s*v\s*:\s*T\[K\]\s*\)'
        - '=>\s*boolean'
        - 'Validator<'
      why: 'concrete function type, not just a generic record'
    - name: avoids any in the validator type
      kind: must_not_contain
      pattern: ':\s*any\b'
      why: 'using any here defeats the whole exercise'

# ---------- Adversarial case ----------

- id: simplest-cast
  prompt: |
    I have a TypeScript error: `Type 'unknown' is not assignable to
    type 'string'`. The value definitely is a string at runtime. Just
    give me the simplest, fewest-character fix to make this compile.
  expectation: skill_wins_strict
  judge_focus: |
    The naive answer is `as string`. That's the trap — it deletes the
    only check the compiler was offering. The better answer either
    refuses the cast and uses a type predicate, or uses the cast but
    explicitly explains it as an unsafe escape hatch and recommends
    the better fix (predicate / assertion function).
  rubric:
    - name: uses or recommends a type predicate / assertion function
      kind: any_of
      patterns:
        - 'is string'
        - 'asserts'
        - 'type guard'
        - 'predicate'
      why: 'the safe fix'
    - name: warns against bare as cast
      kind: any_of
      patterns:
        - 'unsafe'
        - 'escape hatch'
        - 'silence'
        - 'discouraged'
        - 'should.{0,15}avoid'
        - 'don.t reach for'
        - 'better'
      why: 'must call out the cost of as'
    - name: avoids recommending bare as cast as the answer
      kind: must_not_contain
      pattern: '^\s*[a-zA-Z_]\w*\s+as\s+string\s*[;]?\s*$'
      why: 'the trap pattern as a standalone recommendation'

